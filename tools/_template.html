<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Describe what this MTech tool does." />
    <title>Tool name | MTech</title>
    <style>
      :root {
        --ink: #141615;
        --muted: #626763;
        --paper: #f5f5f1;
        --surface: #ffffff;
        --line: #dadcd7;
        --blue: #315cf5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      .site-header {
        width: 100%;
        border-bottom: 1px solid #dadcd7;
        background: rgba(245, 245, 241, 0.94);
      }

      .header-inner {
        display: flex;
        width: min(1120px, calc(100% - 48px));
        min-height: 76px;
        margin-inline: auto;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #141615;
        font-size: 1.02rem;
        font-weight: 760;
        letter-spacing: -0.02em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 7px;
        background: #141615;
        color: white;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 30px;
        color: #626763;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .site-nav a {
        color: inherit;
        font-weight: inherit;
        text-decoration: none;
        transition: color 150ms ease;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible { color: #315cf5; }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0 80px;
      }

      a {
        color: var(--blue);
        font-weight: 700;
        text-underline-offset: 4px;
      }

      h1 {
        margin: 58px 0 12px;
        font-size: clamp(2.7rem, 9vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      .intro {
        max-width: 600px;
        margin: 0 0 30px;
        color: var(--muted);
      }

      .tool-panel {
        padding: clamp(20px, 5vw, 36px);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 3px solid #aebdff;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }
      }

      @media (max-width: 560px) {
        .header-inner { width: min(100% - 28px, 1120px); min-height: 68px; }
        .site-nav { gap: 16px; }
        .site-nav a:nth-child(2) { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- MTECH TOP BAR START: copy this block unchanged into every tool -->
    <header class="site-header" data-mtech-nav="v1">
      <div class="header-inner">
        <a class="brand" href="../index.html" aria-label="MTech home">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>MTech</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="../index.html#tools">Tools</a>
          <a href="../index.html#contribute">Contribute</a>
          <a href="https://github.com/alexon-bench/group-site" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <!-- MTECH TOP BAR END -->
    <main>
      <h1>Tool name</h1>
      <p class="intro">Explain the tool in one clear sentence.</p>

      <section class="tool-panel" aria-label="Tool name">
        <!-- Build the tool interface here. -->
        <p>Your tool starts here.</p>
      </section>
    </main>

    <script>
      // Add small, tool-specific behavior here. Keep all data in the browser.
    </script>
  </body>
</html>
