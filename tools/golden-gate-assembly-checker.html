<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="color-scheme" content="light">
  <title>Golden Gate Assembly Checker — MTech</title>
  <style>
    :root { --font-geist-sans: Arial, Helvetica, sans-serif; --font-geist-mono: "Courier New", ui-monospace, monospace; }
:root {
  --uw-purple: #4b2e83;
  --uw-dark: #251d3e;
  --uw-spirit: #5b4699;
  --uw-gold: #b7a57a;
  --uw-bright-gold: #ffc700;
  --parchment: #f2f0e7;
  --paper: #fbfaf7;
  --white: #ffffff;
  --ink: #211d2a;
  --muted: #686472;
  --line: #d8d3df;
  --teal: #008995;
  --green: #237a57;
  --red: #b73c52;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-geist-sans), Arial, sans-serif; background-image: radial-gradient(circle at 1px 1px, rgba(75,46,131,.055) 1px, transparent 0); background-size: 24px 24px; }
button, input, select, textarea { font: inherit; }
button, select, input[type="file"] { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--uw-bright-gold); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .45; }

.topbar { display: none; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
.brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50% 50% 46% 54%; background: var(--uw-purple); color: var(--uw-bright-gold); font-weight: 800; transform: rotate(-6deg); box-shadow: 3px 3px 0 #e4d08c; }
.brand > span:last-child { display: grid; gap: 2px; }
.brand b { font-size: 15px; letter-spacing: -.02em; }
.brand small { color: var(--muted); font-size: 10px; }
.local-badge { display: flex; align-items: center; gap: 8px; color: var(--uw-dark); font: 650 10px/1 var(--font-geist-mono), monospace; text-transform: uppercase; letter-spacing: .06em; }
.local-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px #ddecdf; }

.hero { padding: 70px clamp(22px, 8vw, 126px) 76px; color: white; background: var(--uw-dark); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; width: 420px; height: 420px; right: -95px; top: -170px; border-radius: 50%; border: 70px solid var(--uw-spirit); border-bottom-color: var(--uw-gold); opacity: .72; transform: rotate(9deg); }
.hero::before { content: ""; position: absolute; width: 130px; height: 130px; right: 23%; bottom: -85px; border-radius: 50%; background: var(--uw-bright-gold); }
.eyebrow { position: relative; z-index: 1; margin: 0 0 20px; color: var(--uw-bright-gold); font: 700 11px/1 var(--font-geist-mono), monospace; text-transform: uppercase; letter-spacing: .09em; }
.hero h1 { position: relative; z-index: 1; max-width: 900px; margin: 0; font-size: clamp(45px, 6.2vw, 86px); line-height: .98; letter-spacing: -.06em; font-weight: 735; }
.hero > p:not(.eyebrow) { position: relative; z-index: 1; max-width: 730px; margin: 27px 0 0; color: #ded8eb; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.55; }
.hero-meta { position: relative; z-index: 1; margin-top: 35px; display: flex; flex-wrap: wrap; gap: 8px; }
.hero-meta span { padding: 8px 11px; border: 1px solid #756992; border-radius: 2px; color: #eeeaf5; font: 600 10px/1 var(--font-geist-mono), monospace; text-transform: uppercase; }

.workspace, .construct-section, .results-section, .assumptions { padding: 72px clamp(22px, 8vw, 126px) 84px; }
.workspace { background: var(--paper); }
.construct-section { background: var(--parchment); border-top: 1px solid var(--line); }
.results-section { background: #f3f0f8; border-top: 1px solid var(--uw-dark); scroll-margin-top: 18px; }
.section-title { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; margin-bottom: 28px; }
.section-title > span { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--uw-purple); color: white; font: 750 11px/1 var(--font-geist-mono), monospace; box-shadow: 3px 3px 0 var(--uw-gold); transform: rotate(-4deg); }
.section-title h2 { margin: 0; color: var(--uw-dark); font-size: clamp(27px, 2.6vw, 37px); line-height: 1; letter-spacing: -.04em; }
.section-title p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
.clear-button, .add-button { min-height: 42px; padding: 0 15px; border: 1px solid var(--uw-purple); border-radius: 999px; background: white; color: var(--uw-purple); font-size: 12px; font-weight: 700; }
.clear-button { border-color: #a69eae; color: var(--muted); }

.import-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 18px; }
.upload-panel, .paste-panel { min-height: 310px; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 8px 24px rgba(55,37,84,.055); }
.upload-panel { padding: 34px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1.5px dashed #9e94ae; transition: border-color .15s, background .15s; }
.upload-panel:hover { border-color: var(--uw-purple); background: #f8f6fc; }
.upload-panel input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload-icon { width: 52px; height: 52px; margin-bottom: 18px; display: grid; place-items: center; border-radius: 48% 52% 44% 56%; background: var(--uw-purple); color: var(--uw-bright-gold); font-size: 25px; font-weight: 700; transform: rotate(-5deg); box-shadow: 4px 4px 0 #e8d99f; }
.upload-panel b { color: var(--uw-purple); font-size: 18px; }
.upload-panel p { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
.upload-panel small { margin-top: 24px; color: #817b87; font-size: 11px; }
.paste-panel { padding: 23px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 11px; }
.paste-panel > div { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.paste-panel > div b { font-size: 16px; }
.paste-panel > div button { padding: 0; border: 0; border-bottom: 1px solid var(--uw-purple); background: transparent; color: var(--uw-purple); font-size: 11px; font-weight: 700; }
.paste-panel input, .paste-panel textarea, .construct-card input, .construct-card select { width: 100%; border: 1px solid var(--line); border-radius: 2px; background: #fdfcfa; color: var(--ink); }
.paste-panel input { min-height: 42px; padding: 0 12px; }
.paste-panel textarea { min-height: 125px; padding: 12px; resize: vertical; font: 11px/1.55 var(--font-geist-mono), monospace; text-transform: uppercase; }
.paste-panel textarea::placeholder { text-transform: none; }
.secondary-button { justify-self: end; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--uw-purple); color: white; font-size: 12px; font-weight: 700; box-shadow: 3px 3px 0 var(--uw-gold); }
.notice { margin-top: 15px; padding: 13px 16px; display: flex; gap: 9px; border-left: 4px solid var(--teal); background: #e6f3f4; color: #315a60; font-size: 12px; }
.notice-error { border-color: var(--red); background: #fae9ed; color: #763743; }

.library-table-wrap { margin-top: 24px; border: 1px solid var(--line); border-radius: 14px; background: white; overflow: hidden; box-shadow: 0 8px 24px rgba(55,37,84,.045); }
.table-head { min-height: 57px; padding: 0 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.table-head b { color: var(--uw-purple); font-size: 13px; }
.table-head span { color: var(--muted); font-size: 11px; }
.library-table { width: 100%; overflow-x: auto; }
.library-row { min-width: 680px; min-height: 52px; padding: 0 18px; display: grid; grid-template-columns: minmax(210px, 1.5fr) 90px 70px minmax(160px, 1fr) 28px; align-items: center; gap: 12px; border-bottom: 1px solid #ece9ef; font-size: 12px; }
.library-row:last-child { border-bottom: 0; }
.library-row strong, .library-row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.library-labels { min-height: 36px; background: #f5f3f7; color: var(--muted); font: 650 9px/1 var(--font-geist-mono), monospace; text-transform: uppercase; letter-spacing: .05em; }
.library-row button { width: 25px; height: 25px; border: 0; border-radius: 50%; background: transparent; color: #8a8292; font-size: 20px; line-height: 1; }
.library-row button:hover { background: #f4e8ec; color: var(--red); }
.empty-state { padding: 36px; color: var(--muted); text-align: center; font-size: 13px; }

.construct-list { display: grid; gap: 14px; }
.construct-card { position: relative; padding: 19px; display: grid; grid-template-columns: 145px minmax(150px, .8fr) minmax(180px, 1fr) 20px minmax(180px, 1fr) minmax(150px, .75fr) auto; align-items: end; gap: 12px; border: 1px solid #cfc8d4; border-left: 5px solid #aca4b1; border-radius: 12px; background: rgba(255,255,255,.78); overflow: hidden; }
.construct-card::after { content: "✦"; position: absolute; right: 10px; top: 7px; color: #d5c27f; font-size: 12px; opacity: .55; }
.construct-card.selected { border-left-color: var(--uw-purple); background: white; box-shadow: 5px 6px 0 rgba(183,165,122,.26); }
.construct-card > label:not(.construct-check) { display: grid; gap: 7px; }
.construct-card label > span { color: var(--muted); font: 650 9px/1 var(--font-geist-mono), monospace; text-transform: uppercase; letter-spacing: .045em; }
.construct-card .name-label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.construct-card .name-label > span { color: inherit; font: inherit; }
.construct-card .name-label i { padding: 3px 6px; border-radius: 999px; background: #eee9f6; color: var(--uw-purple); font: normal 750 8px/1 var(--font-geist-mono), monospace; }
.construct-card .name-label button { padding: 0; border: 0; border-bottom: 1px solid var(--uw-purple); background: transparent; color: var(--uw-purple); font: 700 8px/1.2 var(--font-geist-mono), monospace; }
.construct-card input:not([type="checkbox"]), .construct-card select { min-height: 44px; padding: 0 11px; font-size: 12px; }
.construct-card small { min-height: 12px; color: var(--muted); font-size: 9px; }
.construct-check { align-self: center; display: flex; align-items: center; gap: 10px; }
.construct-check input { width: 17px; height: 17px; accent-color: var(--uw-purple); }
.construct-check span { color: var(--uw-purple) !important; font-weight: 750 !important; }
.plus-sign { align-self: center; justify-self: center; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: #efe7d1; color: var(--uw-purple); font-size: 18px; font-weight: 700; transform: rotate(4deg); }
.remove-construct { align-self: center; padding: 0; border: 0; border-bottom: 1px solid #9a8e9a; background: transparent; color: var(--muted); font-size: 10px; }
.construct-empty { border: 1px dashed #bcb4c2; background: rgba(255,255,255,.5); }
.run-button { width: 100%; min-height: 62px; margin-top: 22px; padding: 0 20px 0 24px; display: flex; align-items: center; justify-content: space-between; border: 0; border-radius: 12px; background: var(--uw-purple); color: white; font-size: 15px; font-weight: 750; box-shadow: 5px 5px 0 var(--uw-gold); }
.run-button b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--uw-bright-gold); color: var(--uw-dark); font: 750 12px/1 var(--font-geist-mono), monospace; }
.run-button:hover:not(:disabled) { background: #3c236d; }

.results-title { align-items: start; }
.batch-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.batch-actions button { min-height: 39px; padding: 0 12px; border: 1px solid var(--uw-purple); background: white; color: var(--uw-purple); font-size: 10px; font-weight: 700; }
.results-list { display: grid; gap: 20px; }
.result-card { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(270px, .75fr); border: 1px solid #ccc5d3; border-radius: 14px; background: white; overflow: hidden; box-shadow: 0 9px 28px rgba(55,37,84,.06); }
.result-card.pass { border-top: 5px solid var(--green); }
.result-card.fail { border-top: 5px solid var(--red); }
.result-main { min-width: 0; padding: 24px; }
.result-head { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
.status-pill { display: inline-block; margin-bottom: 8px; padding: 5px 8px; border-radius: 2px; background: #dcefe5; color: var(--green); font: 750 9px/1 var(--font-geist-mono), monospace; letter-spacing: .07em; }
.fail .status-pill { background: #f7dfe5; color: var(--red); }
.result-head h3 { margin: 0; color: var(--uw-dark); font-size: 25px; letter-spacing: -.035em; overflow-wrap: anywhere; }
.result-head p { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
.result-downloads { display: flex; gap: 7px; }
.result-downloads button { min-height: 37px; padding: 0 12px; border: 1px solid var(--uw-purple); background: white; color: var(--uw-purple); font-size: 10px; font-weight: 700; }
.sequence-output { margin-top: 22px; border: 1px solid var(--uw-dark); border-radius: 9px; background: var(--uw-dark); color: white; overflow: hidden; }
.sequence-output > div { min-height: 49px; padding: 9px 12px 9px 16px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid #554c67; }
.sequence-output > div span { color: #d8d2df; font-size: 10px; }
.sequence-output button { min-height: 30px; padding: 0 10px; border: 1px solid #8d839b; background: transparent; color: white; font-size: 9px; }
.sequence-output pre { max-height: 275px; overflow: auto; margin: 0; padding: 19px 16px; color: #f5df8a; font: 11px/1.75 var(--font-geist-mono), monospace; }
.result-error { margin-top: 22px; padding: 20px; border-left: 4px solid var(--red); background: #fbecf0; }
.result-error b { color: #752d3c; font-size: 13px; }
.result-error p { margin: 7px 0 0; color: #70434c; font-size: 12px; line-height: 1.5; }
.verification-summary { border-left: 1px solid var(--line); background: #faf9fb; }
.summary-heading { padding: 21px 20px; display: grid; gap: 5px; border-bottom: 1px solid var(--line); }
.summary-heading span { color: var(--uw-dark); font-size: 14px; font-weight: 750; }
.summary-heading i { color: var(--green); font: normal 650 9px/1 var(--font-geist-mono), monospace; text-transform: uppercase; letter-spacing: .05em; }
.fail .summary-heading i { color: var(--red); }
.verification-summary dl { margin: 0; }
.verification-summary dl > div { min-height: 67px; padding: 13px 20px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 15px; align-items: center; border-bottom: 1px solid #e8e4eb; }
.verification-summary dt { color: var(--muted); font-size: 10px; }
.verification-summary dd { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; color: var(--uw-dark); font-size: 11px; }
.verification-summary code { padding: 4px 5px; background: #ece8f2; color: var(--uw-purple); font: 750 11px/1 var(--font-geist-mono), monospace; }
.verification-summary dd b { font-size: 11px; }
.verification-summary dd small { flex-basis: 100%; color: var(--muted); font-size: 9px; line-height: 1.35; }
.zero-sites { color: var(--green); }

.assumptions { display: grid; grid-template-columns: .65fr 1.35fr; gap: 60px; background: white; }
.assumptions p { margin: 0 0 12px; color: var(--uw-purple); font: 700 10px/1 var(--font-geist-mono), monospace; text-transform: uppercase; letter-spacing: .07em; }
.assumptions h2 { max-width: 320px; margin: 0; color: var(--uw-dark); font-size: 38px; line-height: 1.05; letter-spacing: -.04em; }
.assumptions ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.assumptions li { padding: 18px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.5; }
.assumptions li b { color: var(--ink); }
footer { min-height: 84px; padding: 24px clamp(22px, 5vw, 72px); display: flex; align-items: center; gap: 24px; background: var(--uw-dark); color: white; }
footer b { color: var(--uw-bright-gold); }
footer span { color: #c9c3d1; font-size: 11px; }
footer a { margin-left: auto; color: white; text-decoration: none; font-size: 11px; }

@media (max-width: 1120px) {
  .construct-card { grid-template-columns: 130px 1fr 1fr 20px 1fr; }
  .construct-card > label:nth-of-type(5) { grid-column: 2 / 4; }
  .remove-construct { grid-column: 5; }
}
@media (max-width: 860px) {
  .hero::after { right: -220px; }
  .import-grid, .result-card, .assumptions { grid-template-columns: 1fr; }
  .verification-summary { border-left: 0; border-top: 1px solid var(--line); }
  .construct-card { grid-template-columns: 1fr 1fr; align-items: end; }
  .construct-check { grid-column: 1 / -1; }
  .plus-sign { display: none; }
  .construct-card > label:nth-of-type(5), .remove-construct { grid-column: auto; }
  .batch-actions { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (max-width: 580px) {
  .local-badge { display: none; }
  .hero { padding-top: 54px; padding-bottom: 60px; }
  .hero h1 { font-size: 47px; }
  .workspace, .construct-section, .results-section, .assumptions { padding-top: 55px; padding-bottom: 62px; }
  .section-title { grid-template-columns: auto 1fr; align-items: start; }
  .section-title > button, .section-title > .batch-actions { grid-column: 1 / -1; justify-self: stretch; }
  .import-grid, .construct-card { grid-template-columns: 1fr; }
  .upload-panel { min-height: 250px; }
  .construct-check, .construct-card > label:nth-of-type(5), .remove-construct { grid-column: auto; }
  .result-head { flex-direction: column; }
  .result-downloads { width: 100%; }
  .result-downloads button { flex: 1; }
  .sequence-output > div { align-items: flex-start; flex-direction: column; }
  .verification-summary dl > div { grid-template-columns: 1fr 1.2fr; }
  footer { align-items: flex-start; flex-direction: column; gap: 8px; }
  footer a { margin: 8px 0 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
